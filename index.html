<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Midea</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="https://s3.amazonaws.com/botgen/Uploads/midea_1736260299.png" type="image/png">
</head> 
<body>
    <div class="search-container">
        <h1 id="searchTitle">Búsqueda datos Midea</h1>
        
        <select id="searchType" onchange="updatePlaceholder()">
            <option value="pdv">Buscar PDV</option>
            <option value="producto">Buscar Producto</option>
        </select>

        <input type="text" id="searchInput" placeholder="Ingresa el nombre PDV" oninput="handleInput()">

        <div id="results"></div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
</body>
</html>
